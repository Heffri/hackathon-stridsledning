<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #060d14;
    overflow: hidden;
    font-family: monospace;
    color: #aacccc;
    user-select: none;
  }
  #viewport {
    width: 100vw; height: 100vh;
    overflow: hidden;
    cursor: grab;
  }
  #viewport.dragging { cursor: grabbing; }
  #map-wrap {
    transform-origin: 0 0;
    display: inline-block;
  }
  svg {
    display: block;
    background: #0a1a28;
  }
  /* grid overlay */
  #hud {
    position: fixed; top: 12px; left: 12px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(100,200,200,0.2);
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.7;
    pointer-events: none;
  }
  #tooltip {
    position: fixed;
    background: rgba(0,10,20,0.88);
    border: 1px solid rgba(100,200,255,0.4);
    padding: 7px 11px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    max-width: 220px;
    line-height: 1.5;
  }
  .asset { cursor: pointer; }
  .asset:hover { filter: brightness(1.35); }
</style>
</head>

<div id="hud">
  <div>BOREAL PASSAGE — TACTICAL MAP</div>
  <div id="coords">Cursor: — km</div>
  <div id="zoom-label">Zoom: 100%</div>
  <div style="margin-top:4px;color:#556677;">Scroll = zoom · Drag = pan · Click asset = info</div>
</div>

<div id="tooltip"></div>

<script>
const vp   = document.getElementById('viewport');
const wrap = document.getElementById('map-wrap');
const svg  = document.getElementById('map');
const tt   = document.getElementById('tooltip');
const zl   = document.getElementById('zoom-label');
const cl   = document.getElementById('coords');

let scale = 0.65, ox = 0, oy = 0;
let dragging = false, lx = 0, ly = 0;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function applyTransform() {
  wrap.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
  zl.textContent = `Zoom: ${Math.round(scale*100)}%`;
}

// initial centre
function centre() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const mw = 1667 * scale, mh = 1300 * scale;
  ox = (vw - mw) / 2;
  oy = (vh - mh) / 2;
  applyTransform();
}
centre();

// zoom
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const newScale = clamp(scale * factor, 0.2, 5);
  // zoom toward cursor
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX, my = e.clientY;
  ox = mx - (mx - ox) * newScale / scale;
  oy = my - (my - oy) * newScale / scale;
  scale = newScale;
  applyTransform();
}, {passive: false});

// drag
vp.addEventListener('mousedown', e => {
  if (e.target.closest('.asset')) return;
  dragging = true; lx = e.clientX; ly = e.clientY;
  vp.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  // cursor km coords
  const svgRect = svg.getBoundingClientRect();
  const cx = (e.clientX - svgRect.left) / scale;
  const cy = (e.clientY - svgRect.top)  / scale;
  cl.textContent = `Cursor: ${Math.round(cx)} , ${Math.round(cy)} km`;

  if (!dragging) return;
  ox += e.clientX - lx; oy += e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; vp.classList.remove('dragging'); });

// tooltip
document.querySelectorAll('.asset').forEach(el => {
  el.addEventListener('mouseenter', e => {
    const side = el.dataset.side === 'north' ? '🔵 NORTH' : '🟠 SOUTH';
    tt.innerHTML = `<b>${el.dataset.name}</b><br>${side}<br><span style="color:#889">${el.dataset.info}</span>`;
    tt.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top  = (e.clientY + 14) + 'px';
  });
  el.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
});
</script>
