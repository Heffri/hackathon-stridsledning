<svg id="map" width="100%" viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
    </pattern>
    <!-- Reusable mountain cluster symbol (north palette) -->
    <symbol id="mtn-n" viewBox="-28 -18 56 20" overflow="visible">
      <polygon points="0,-17 -12,1 12,1"    fill="#3a4e3a" stroke="#1a2e1a" stroke-width="0.5"/>
      <polygon points="0,-17 -4,-9 4,-9"    fill="#dde8dd" opacity="0.55"/>
      <polygon points="-17,-9 -27,1 -7,1"   fill="#334433" stroke="#1a2e1a" stroke-width="0.5"/>
      <polygon points="-17,-9 -21,-3 -13,-3" fill="#dde8dd" opacity="0.35"/>
      <polygon points="17,-9 7,1 27,1"      fill="#334433" stroke="#1a2e1a" stroke-width="0.5"/>
      <polygon points="17,-9 13,-3 21,-3"   fill="#dde8dd" opacity="0.35"/>
    </symbol>
    <!-- Reusable mountain cluster symbol (south palette) -->
    <symbol id="mtn-s" viewBox="-28 -18 56 20" overflow="visible">
      <polygon points="0,-17 -12,1 12,1"    fill="#4a4230" stroke="#2a2a18" stroke-width="0.5"/>
      <polygon points="0,-17 -4,-9 4,-9"    fill="#dde8cc" opacity="0.50"/>
      <polygon points="-17,-9 -27,1 -7,1"   fill="#3e381e" stroke="#2a2a18" stroke-width="0.5"/>
      <polygon points="-17,-9 -21,-3 -13,-3" fill="#dde8cc" opacity="0.30"/>
      <polygon points="17,-9 7,1 27,1"      fill="#3e381e" stroke="#2a2a18" stroke-width="0.5"/>
      <polygon points="17,-9 13,-3 21,-3"   fill="#dde8cc" opacity="0.30"/>
    </symbol>
  </defs>

  <!-- Sea background -->
  <rect width="1000" height="780" fill="#0f1e2e"/>
  <rect width="1000" height="780" fill="url(#grid)"/>

  <!-- ===================== NORTH MAINLAND =====================
       CSV polygon scaled at 0.6x/0.6y, full map extent 1666.7×1300 km → 1000×780 px -->
  <path fill="#263326" stroke="#1a1a1a" stroke-width="1.5" d="
    M 0,0 L 1000,0 L 1000,170
    L 920,188 L 860,174 L 800,170
    L 742,205 L 678,190 L 616,178
    L 556,212 L 488,194 L 428,188
    L 366,220 L 302,192 L 236,200
    L 178,230 L 118,204 L 54,212
    L 0,228 Z
  "/>

  <!-- North mountain ranges (interior, y 50–115) -->
  <!-- NW range -->
  <use href="#mtn-n" x="135" y="108" opacity="0.88"/>
  <use href="#mtn-n" x="192" y="96"  opacity="0.88"/>
  <!-- NW-C range -->
  <use href="#mtn-n" x="285" y="88"  opacity="0.88"/>
  <use href="#mtn-n" x="340" y="82"  opacity="0.85"/>
  <!-- NC range -->
  <use href="#mtn-n" x="435" y="78"  opacity="0.88"/>
  <use href="#mtn-n" x="500" y="72"  opacity="0.88"/>
  <use href="#mtn-n" x="560" y="80"  opacity="0.85"/>
  <!-- NE-C range -->
  <use href="#mtn-n" x="660" y="83"  opacity="0.88"/>
  <use href="#mtn-n" x="720" y="76"  opacity="0.88"/>
  <!-- NE range -->
  <use href="#mtn-n" x="820" y="80"  opacity="0.88"/>
  <use href="#mtn-n" x="885" y="88"  opacity="0.88"/>
  <use href="#mtn-n" x="960" y="94"  opacity="0.85"/>

  <!-- North foothills (near coastline, y 155–215) -->
  <ellipse cx="78"  cy="194" rx="18" ry="7"  fill="#304030" opacity="0.55"/>
  <ellipse cx="108" cy="186" rx="13" ry="5"  fill="#304030" opacity="0.50"/>
  <ellipse cx="218" cy="176" rx="16" ry="6"  fill="#304030" opacity="0.55"/>
  <ellipse cx="256" cy="168" rx="13" ry="5"  fill="#304030" opacity="0.50"/>
  <ellipse cx="308" cy="170" rx="17" ry="6"  fill="#304030" opacity="0.55"/>
  <ellipse cx="348" cy="180" rx="13" ry="5"  fill="#304030" opacity="0.50"/>
  <ellipse cx="490" cy="162" rx="16" ry="6"  fill="#304030" opacity="0.55"/>
  <ellipse cx="524" cy="170" rx="13" ry="5"  fill="#304030" opacity="0.50"/>
  <ellipse cx="608" cy="162" rx="17" ry="6"  fill="#304030" opacity="0.55"/>
  <ellipse cx="648" cy="172" rx="13" ry="5"  fill="#304030" opacity="0.50"/>
  <ellipse cx="756" cy="158" rx="16" ry="6"  fill="#304030" opacity="0.55"/>
  <ellipse cx="824" cy="156" rx="17" ry="6"  fill="#304030" opacity="0.55"/>
  <ellipse cx="910" cy="150" rx="15" ry="5"  fill="#304030" opacity="0.50"/>
  <ellipse cx="978" cy="155" rx="13" ry="5"  fill="#304030" opacity="0.50"/>

  <!-- ===================== NORTH ISLANDS ===================== -->
  <!-- North Island West — CSV: center ~657km,493km → SVG ~394,296 -->
  <path fill="#263326" stroke="#1a1a1a" stroke-width="1" d="
    M 355,268 L 378,256 L 410,258 L 424,278
    L 436,296 L 426,322 L 406,328 L 386,334
    L 362,318 L 354,298 Z
  "/>
  <!-- small hill on North Island West -->
  <ellipse cx="393" cy="298" rx="16" ry="6" fill="#304030" opacity="0.55"/>

  <!-- North Island East — CSV: center ~1157km,388km → SVG ~694,233 -->
  <path fill="#263326" stroke="#1a1a1a" stroke-width="1" d="
    M 678,214 L 692,204 L 710,208 L 716,224
    L 722,238 L 712,254 L 696,256 L 680,258
    L 668,244 L 668,228 Z
  "/>

  <!-- North Remote Island — CSV: center ~303km,627km → SVG ~182,376 -->
  <path fill="#263326" stroke="#1a1a1a" stroke-width="1.2" d="
    M 148,355 L 160,342 L 180,338 L 196,346
    L 212,354 L 220,372 L 216,390 L 198,416
    L 182,414 L 166,412 L 152,398 L 148,380 Z
  "/>
  <!-- hill on remote island -->
  <ellipse cx="185" cy="374" rx="15" ry="5" fill="#304030" opacity="0.55"/>

  <!-- ===================== NORTH ASSETS =====================
       Triangles: bottom-left, apex, bottom-right (upward-pointing, ~22px tall, 26px wide) -->
  <!-- Northern Vanguard Base  (119, 201) -->
  <polygon points="106,213 119,191 132,213"
    fill="#3fc1ff" stroke="#000" stroke-width="1.2"
    data-name="Northern Vanguard Base" data-info="Western coastal military base (Mainland)." data-side="north"/>
  <!-- Highridge Command  (503, 45) -->
  <polygon points="490,57 503,35 516,57"
    fill="#3fc1ff" stroke="#000" stroke-width="1.2"
    data-name="Highridge Command" data-info="Deep inland military base (Mainland)." data-side="north"/>
  <!-- Boreal Watch Post  (695, 231) — on North Island East -->
  <polygon points="682,243 695,221 708,243"
    fill="#3fc1ff" stroke="#000" stroke-width="1.2"
    data-name="Boreal Watch Post" data-info="Forward operating base (Island)." data-side="north"/>
  <!-- Arktholm Capital X  (251, 57) -->
  <rect x="242" y="48" width="18" height="18"
    fill="#ffcc00" stroke="#000" stroke-width="2" rx="2"
    data-name="Arktholm (Capital X)" data-info="Political capital of Country X (Mainland)." data-side="north"/>
  <!-- Valbrek  (854, 128) -->
  <rect x="848" y="122" width="13" height="13"
    fill="#ffffff" stroke="#000" stroke-width="1.5" rx="1"
    data-name="Valbrek" data-info="Eastern city near coast (Mainland)." data-side="north"/>
  <!-- Nordvik  (84, 194) -->
  <rect x="78" y="188" width="13" height="13"
    fill="#ffffff" stroke="#000" stroke-width="1.5" rx="1"
    data-name="Nordvik" data-info="Major western coastal city (Mainland)." data-side="north"/>

  <!-- ===================== SOUTH MAINLAND =====================
       CSV polygon scaled at 0.6, from y=1300km(780px) down to coastline ~y=606-648px -->
  <path fill="#3a3222" stroke="#1a1a1a" stroke-width="1.5" d="
    M 0,780 L 1000,780 L 1000,640
    L 948,616 L 882,628 L 818,642
    L 756,608 L 688,622 L 624,640
    L 560,606 L 492,626 L 428,646
    L 362,612 L 294,622 L 232,648
    L 168,618 L 98,630 L 30,648
    L 0,638 Z
  "/>

  <!-- South foothills (just inside north coast of south mainland, y 650–672) -->
  <ellipse cx="50"  cy="658" rx="18" ry="7"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="88"  cy="650" rx="13" ry="5"  fill="#4a4230" opacity="0.50"/>
  <ellipse cx="180" cy="648" rx="17" ry="6"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="224" cy="660" rx="13" ry="5"  fill="#4a4230" opacity="0.50"/>
  <ellipse cx="310" cy="654" rx="16" ry="6"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="354" cy="664" rx="13" ry="5"  fill="#4a4230" opacity="0.50"/>
  <ellipse cx="450" cy="656" rx="17" ry="6"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="488" cy="646" rx="13" ry="5"  fill="#4a4230" opacity="0.50"/>
  <ellipse cx="618" cy="658" rx="17" ry="6"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="660" cy="648" rx="13" ry="5"  fill="#4a4230" opacity="0.50"/>
  <ellipse cx="758" cy="652" rx="16" ry="6"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="836" cy="660" rx="17" ry="6"  fill="#4a4230" opacity="0.55"/>
  <ellipse cx="916" cy="650" rx="15" ry="5"  fill="#4a4230" opacity="0.50"/>
  <ellipse cx="975" cy="654" rx="13" ry="5"  fill="#4a4230" opacity="0.50"/>

  <!-- South mountain ranges (interior, y 710–750) -->
  <!-- SW range -->
  <use href="#mtn-s" x="118" y="742" opacity="0.88"/>
  <use href="#mtn-s" x="184" y="736" opacity="0.88"/>
  <!-- SC-W range -->
  <use href="#mtn-s" x="306" y="730" opacity="0.88"/>
  <use href="#mtn-s" x="370" y="724" opacity="0.85"/>
  <!-- SC range -->
  <use href="#mtn-s" x="462" y="720" opacity="0.88"/>
  <use href="#mtn-s" x="526" y="726" opacity="0.88"/>
  <!-- SE-C range -->
  <use href="#mtn-s" x="646" y="720" opacity="0.88"/>
  <use href="#mtn-s" x="710" y="714" opacity="0.88"/>
  <!-- SE range -->
  <use href="#mtn-s" x="804" y="718" opacity="0.88"/>
  <use href="#mtn-s" x="872" y="726" opacity="0.88"/>
  <use href="#mtn-s" x="952" y="734" opacity="0.85"/>

  <!-- ===================== SOUTH ISLANDS ===================== -->
  <!-- South Forward Island — CSV: center ~1408km,753km → SVG ~845,452 -->
  <path fill="#3a3222" stroke="#1a1a1a" stroke-width="1" d="
    M 818,428 L 842,416 L 870,422 L 876,442
    L 882,460 L 866,480 L 846,480 L 826,480
    L 810,464 L 812,446 Z
  "/>
  <!-- hill on south forward island -->
  <ellipse cx="847" cy="452" rx="15" ry="5" fill="#4a4230" opacity="0.55"/>

  <!-- South Small Island — CSV: center ~423km,920km → SVG ~254,552 -->
  <path fill="#3a3222" stroke="#1a1a1a" stroke-width="1" d="
    M 238,534 L 256,522 L 276,528 L 280,546
    L 284,562 L 270,576 L 253,576 L 236,574
    L 224,560 L 226,544 Z
  "/>

  <!-- South Central Peninsula — CSV: center ~898km,828km → SVG ~539,497 -->
  <path fill="#3a3222" stroke="#1a1a1a" stroke-width="1" d="
    M 530,536 L 546,520 L 568,506 L 566,484
    L 564,464 L 542,456 L 526,470 L 510,484
    L 510,518 L 530,536 Z
  "/>

  <!-- ===================== SOUTH ASSETS ===================== -->
  <!-- Firewatch Station  (839, 643) -->
  <polygon points="826,655 839,633 852,655"
    fill="#ff8855" stroke="#000" stroke-width="1.2"
    data-name="Firewatch Station" data-info="Eastern coastal military base (Mainland)." data-side="south"/>
  <!-- Southern Redoubt  (193, 743) -->
  <polygon points="180,755 193,733 206,755"
    fill="#ff8855" stroke="#000" stroke-width="1.2"
    data-name="Southern Redoubt" data-info="Inland military base (Mainland)." data-side="south"/>
  <!-- Spear Point Base  (551, 501) — on South Central Peninsula -->
  <polygon points="538,513 551,491 564,513"
    fill="#ff8855" stroke="#000" stroke-width="1.2"
    data-name="Spear Point Base" data-info="Forward military strike base (Island)." data-side="south"/>
  <!-- Meridia Capital Y  (735, 725) -->
  <rect x="726" y="716" width="18" height="18"
    fill="#ffcc00" stroke="#000" stroke-width="2" rx="2"
    data-name="Meridia (Capital Y)" data-info="Political capital of Country Y (Mainland)." data-side="south"/>
  <!-- Callhaven  (58, 690) -->
  <rect x="52" y="684" width="13" height="13"
    fill="#ffffff" stroke="#000" stroke-width="1.5" rx="1"
    data-name="Callhaven" data-info="Major western city (Mainland)." data-side="south"/>
  <!-- Solano  (346, 742) -->
  <rect x="340" y="736" width="13" height="13"
    fill="#ffffff" stroke="#000" stroke-width="1.5" rx="1"
    data-name="Solano" data-info="Inland major city (Mainland)." data-side="south"/>

  <!-- ===================== MAP LABELS ===================== -->
  <text x="500" y="22"  fill="rgba(200,230,200,0.30)" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="5">COUNTRY X — NORTHERN TERRITORIES</text>
  <text x="500" y="770" fill="rgba(230,210,170,0.30)" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="5">COUNTRY Y — SOUTHERN UNION</text>
  <text x="500" y="418" fill="rgba(180,210,240,0.06)" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="6">THE BOREAL PASSAGE</text>

  <!-- Scale bar: 120px = 200 km (at 0.6 px/km) -->
  <line x1="840" y1="752" x2="960" y2="752" stroke="white" stroke-width="2"/>
  <line x1="840" y1="747" x2="840" y2="757" stroke="white" stroke-width="2"/>
  <line x1="960" y1="747" x2="960" y2="757" stroke="white" stroke-width="2"/>
  <text x="900" y="768" fill="rgba(255,255,255,0.40)" font-size="10" text-anchor="middle">200 km</text>

  <!-- Corner debug coords -->
  <text x="6"   y="12"  fill="rgba(255,255,255,0.12)" font-size="9">0,0</text>
  <text x="948" y="775" fill="rgba(255,255,255,0.12)" font-size="9">1000,780</text>
</svg>
