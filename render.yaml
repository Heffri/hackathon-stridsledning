services:
  - type: web
    name: hackathon-stridsledning
    runtime: python
    plan: free
    rootDir: team-missile-intercept/backend
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BLUE_POLICY_PATH
        value: rl/runs/blue_reward_v4_finetune/model.zip
      - key: RED_WAVE_MODE
        value: scripted
      - key: OMP_NUM_THREADS
        value: "1"
