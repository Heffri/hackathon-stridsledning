<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Stridsledning — Missile Intercept Demo</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div class="hud-block">
        <div class="hud-title">Smart Stridsledning</div>
        <div class="hud-sub">AI vs AI Missile Intercept — Milestone B</div>
      </div>
      <div class="hud-block stats">
        <div>T <span id="stat-t">0.0</span>s</div>
        <div>Wave <span id="stat-wave">0</span>/<span id="stat-waves">0</span></div>
      </div>
      <div class="hud-block stats">
        <div>Threats: <span id="stat-active-t">0</span> active</div>
        <div>Intercepts: <span id="stat-intercepts">0</span></div>
        <div>Leaked: <span id="stat-leaked">0</span></div>
      </div>
    </div>

    <div id="hud-bottom">
      <button id="btn-start">Start</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-reset">Reset</button>
      <label class="speed">
        Speed
        <input id="speed" type="range" min="0.5" max="5" step="0.5" value="1" />
        <span id="speed-val">1.0x</span>
      </label>
      <span id="ws-status" class="disconnected">disconnected</span>
    </div>

    <div id="log">
      <div class="log-col">
        <div class="log-title">Red AI</div>
        <div id="log-red"></div>
      </div>
      <div class="log-col">
        <div class="log-title">Blue AI</div>
        <div id="log-blue"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
